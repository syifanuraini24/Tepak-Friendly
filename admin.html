<script src="config.js"></script>
<script>
  const GAS_URL = CONFIG.GAS_URL;
  const SESSION_DURATION = 6 * 60 * 60 * 1000;

  document.addEventListener('DOMContentLoaded', () => { cekSesiLogin(); });

  function cekSesiLogin() {
    const loginTime = localStorage.getItem('tepak_admin_login_time');
    if (loginTime && (new Date().getTime() - parseInt(loginTime)) < SESSION_DURATION) {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('statusOnline').classList.remove('hidden');
      loadDataAdmin();
    } else { logout(false); }
  }

  async function login() {
    const pass = document.getElementById('passInput').value;
    if (!pass) return showCustomWarning("Perhatian", "Masukkan password terlebih dahulu!");

    const btnLogin = document.querySelector('#loginSection button');
    const oldText = btnLogin.innerText;
    btnLogin.innerText = 'Memeriksa...'; btnLogin.disabled = true;
    try {
      const response = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'login_admin', password: pass }) });
      const result = await response.json();
      if (result.status === 'success') {
        localStorage.setItem('tepak_admin_login_time', new Date().getTime().toString());
        cekSesiLogin();
      } else {
        showCustomWarning("Login Gagal", "Password admin salah!");
        btnLogin.innerText = oldText;
        btnLogin.disabled = false;
      }
    } catch (error) {
      showCustomWarning("Koneksi Error", "Terjadi kesalahan koneksi ke server.");
      btnLogin.innerText = oldText;
      btnLogin.disabled = false;
    }
  }

  function logout(pesanAlert = true) {
    localStorage.removeItem('tepak_admin_login_time');
    document.getElementById('adminPanel').classList.add('hidden');
    document.getElementById('statusOnline').classList.add('hidden');
    document.getElementById('loginSection').classList.remove('hidden');
    document.getElementById('passInput').value = '';
    if (pesanAlert) {
      showCustomWarning("Keluar Sesi", "Berhasil keluar dari dashboard admin.");
    }
  }

  function showConfirmModal(title, desc, confirmButtonText, confirmButtonClass, onConfirm) {
    const modal = document.getElementById('customModal');
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalDesc').innerText = desc;
    const btnConfirm = document.getElementById('modalBtnConfirm');
    btnConfirm.innerText = confirmButtonText;
    btnConfirm.className = `flex-1 font-bold text-xs py-2.5 px-3 rounded-xl transition text-white ${confirmButtonClass}`;
    modal.classList.remove('hidden');

    const newBtnConfirm = btnConfirm.cloneNode(true);
    const newBtnCancel = document.getElementById('modalBtnCancel').cloneNode(true);
    btnConfirm.parentNode.replaceChild(newBtnConfirm, btnConfirm);
    document.getElementById('modalBtnCancel').parentNode.replaceChild(newBtnCancel, document.getElementById('modalBtnCancel'));

    newBtnConfirm.addEventListener('click', () => { modal.classList.add('hidden'); onConfirm(); });
    newBtnCancel.addEventListener('click', () => { modal.classList.add('hidden'); });
  }

  function showCustomWarning(title, desc) {
    const modal = document.getElementById('customModal');
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalDesc').innerText = desc;
    const btnConfirm = document.getElementById('modalBtnConfirm');
    btnConfirm.innerText = "OK";
    btnConfirm.className = `flex-1 font-bold text-xs py-2.5 px-3 rounded-xl transition text-white bg-blue-600 hover:bg-blue-700`;

    const btnCancel = document.getElementById('modalBtnCancel');
    btnCancel.classList.add('hidden');
    modal.classList.remove('hidden');

    const newBtnConfirm = btnConfirm.cloneNode(true);
    btnConfirm.parentNode.replaceChild(newBtnConfirm, btnConfirm);

    newBtnConfirm.addEventListener('click', () => {
      modal.classList.add('hidden');
      btnCancel.classList.remove('hidden');
    });
  }

  // LOAD DATA SECARA HALUS (TANPA REFRESH HALAMAN)
  async function loadDataAdmin() {
    const list = document.getElementById('listMenunggu');
    const divAktif = document.getElementById('jadwalAktifList');
    const divNonaktif = document.getElementById('jadwalNonaktifList');

    try {
      const response = await fetch(GAS_URL);
      const data = await response.json();
      list.innerHTML = '';
      divAktif.innerHTML = '';
      divNonaktif.innerHTML = '';

      const formatRp = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 });
      let totalLunasNum = 0, totalPendingNum = 0;

      (data.pemain || []).forEach(item => {
        const nominal = parseInt(item.tagihan || 0);
        if (item.status && item.status.includes('Lunas')) totalLunasNum += nominal;
        else if (item.status && item.status.includes('Menunggu')) totalPendingNum += nominal;
      });
      document.getElementById('totalDanaLunas').innerText = formatRp.format(totalLunasNum);
      document.getElementById('totalDanaPending').innerText = formatRp.format(totalPendingNum);

      const jadwalList = data.jadwal || [];
      const pemainList = data.pemain || [];

      jadwalList.sort((a, b) => {
        let dateA = a.tanggal ? new Date(a.tanggal) : new Date(0);
        let dateB = b.tanggal ? new Date(b.tanggal) : new Date(0);
        if (dateA - dateB !== 0) return dateA - dateB;
        return (a.jam || '').localeCompare(b.jam || '');
      });

      let countAktif = 0;
      let countNonaktif = 0;

      jadwalList.forEach(j => {
        const pesertaJadwal = pemainList.filter(p => p.jadwalId === j.id && p.status && !p.status.includes('Dihapus'));
        const isNonaktif = j.status && j.status.toString().toLowerCase().includes('nonaktif');

        let listNamaHtml = pesertaJadwal.length === 0 ? '<li class="text-slate-400 italic text-[11px] py-2 text-center">Belum ada peserta.</li>' : '';
        pesertaJadwal.forEach((p, idx) => {
          const isLunas = p.status.includes('Lunas');
          listNamaHtml += `
              <li class="py-1.5 px-2.5 border-b border-slate-100 last:border-b-0 flex justify-between items-center text-xs">
                <div><span class="font-bold text-slate-800">${idx + 1}. ${p.nama}</span></div>
                <div class="text-right flex items-center gap-2">
                  <div>
                    <span class="block font-mono font-semibold text-slate-700">${formatRp.format(p.tagihan || 0)}</span>
                    <span class="inline-block text-[10px] font-bold px-1.5 py-0.5 rounded-md ${isLunas ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">${p.status}</span>
                  </div>
                  <div class="flex gap-1">
                    <button onclick="bukaModalEditNominal(${p.rowIndex}, '${p.nama}', ${p.tagihan || 0})" class="bg-slate-100 p-1.5 rounded-lg border hover:bg-slate-200 transition">✏️</button>
                    <button onclick="hapusPemainDariRekap(${p.rowIndex}, this)" class="bg-rose-50 text-rose-600 p-1.5 rounded-lg border hover:bg-rose-100 transition">🗑️</button>
                  </div>
                </div>
              </li>`;
        });

        const displayTanggal = j.tanggal ? new Date(j.tanggal).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '-';

        const cardHtml = `
            <div class="border ${isNonaktif ? 'border-slate-200 bg-slate-50/50 grayscale-[20%]' : 'border-emerald-100 bg-white shadow-sm'} rounded-2xl p-4 space-y-3 transition-all">
              <div class="flex justify-between items-start border-b border-slate-100 pb-2">
                <div>
                  <span class="text-[10px] bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded-md border">${j.id}</span>
                  <h3 class="font-bold text-sm text-slate-900 mt-1">${j.infoRaw}</h3>
                </div>
                <div class="flex items-center gap-1.5 flex-wrap justify-end">
                  <span class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-100">Slot: ${pesertaJadwal.length}/${j.kuota}</span>
                  <button onclick="bukaModalEditJadwal('${j.id}', '${j.tanggal}', \`${j.infoRaw}\`, '${j.jam}', ${j.htm}, ${j.kuota})" class="text-[10px] font-bold px-2.5 py-1 rounded-xl border bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100 transition" title="Edit Jadwal">✏️ Edit</button>
                  <button onclick="hapusJadwalMaster('${j.id}')" class="text-[10px] font-bold px-2.5 py-1 rounded-xl border bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100 transition" title="Hapus Jadwal">🗑️ Hapus</button>
                  <button onclick="copyListKeWA('${j.id}', '${j.tanggal}', \`${j.infoRaw}\`, ${j.kuota})" class="text-[10px] font-bold px-2.5 py-1 rounded-xl border bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100 transition" title="Copy WA">📋 Copy WA</button>
                  <button onclick="toggleStatusJadwal('${j.id}', '${isNonaktif ? 'Aktif' : 'Nonaktif'}', this)" class="text-[10px] font-bold px-2.5 py-1 rounded-xl border transition ${isNonaktif ? 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100' : 'bg-rose-50 text-rose-700 hover:bg-rose-100'}">${isNonaktif ? '🟢 Aktifkan' : '🔴 Nonaktifkan'}</button>
                </div>
              </div>
              <div class="text-xs text-slate-600 flex justify-between bg-slate-50 p-2 rounded-xl border border-slate-100 font-medium">
                <span>🗓️ ${displayTanggal} &nbsp; ⏰ ${j.jam}</span>
                <span>HTM: Rp ${parseInt(j.htm || 0).toLocaleString('id-ID')}</span>
              </div>
              <div class="rounded-xl border border-slate-200 overflow-hidden">
                <div class="bg-slate-50 px-3 py-1.5 text-[11px] font-bold text-slate-700 border-b border-slate-200">Daftar Peserta:</div>
                <ul class="divide-y divide-slate-100 max-h-40 overflow-y-auto">${listNamaHtml}</ul>
              </div>
            </div>`;

        if (isNonaktif) {
          divNonaktif.innerHTML += cardHtml;
          countNonaktif++;
        } else {
          divAktif.innerHTML += cardHtml;
          countAktif++;
        }
      });

      if (countAktif === 0) divAktif.innerHTML = '<div class="text-center text-xs text-slate-400 py-4">Belum ada jadwal aktif.</div>';
      if (countNonaktif === 0) divNonaktif.innerHTML = '<div class="text-center text-xs text-slate-400 py-4">Belum ada history jadwal.</div>';

      const pendingList = pemainList.filter(item => item.status && item.status.includes('Menunggu'));
      if (pendingList.length === 0) {
        list.innerHTML = '<li class="text-center text-emerald-700 text-xs font-bold p-4 bg-emerald-50 rounded-2xl border border-emerald-100">Tidak ada peserta yang menunggu konfirmasi! 🎉</li>';
      } else {
        pendingList.forEach(item => {
          const tagihanRp = formatRp.format(item.tagihan || 0);
          list.innerHTML += `
              <li class="p-3.5 border border-amber-200 bg-amber-50/40 rounded-2xl flex flex-col space-y-2.5 text-xs">
                <div class="flex justify-between items-start">
                  <div>
                    <strong class="text-slate-900 text-sm block">${item.nama}</strong>
                    <span class="font-mono text-blue-700 font-bold bg-white px-2 py-0.5 border border-blue-100 rounded-md mt-1 inline-block">${tagihanRp}</span>
                  </div>
                  <div class="flex gap-1.5">
                    <button onclick="accPemain(${item.rowIndex}, this)" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-2 rounded-xl transition">ACC Lunas</button>
                    <button onclick="hapusPemain(${item.rowIndex}, this)" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-3 py-2 rounded-xl transition">Hapus</button>
                  </div>
                </div>
                <div class="text-[11px] text-slate-600 border-t border-amber-100 pt-2 flex flex-col gap-0.5">
                  <span>📍 <strong>[${item.jadwalId}]</strong> ${item.jadwalInfo}</span>
                </div>
              </li>`;
        });
      }
    } catch (error) {
      list.innerHTML = '<li class="text-center text-rose-600 text-xs py-4">Gagal memuat data.</li>';
    }
  }

  function copyListKeWA(jadwalId, tanggal, infoRaw, kuota) {
    fetch(GAS_URL).then(res => res.json()).then(data => {
      const pesertaJadwal = (data.pemain || []).filter(p => p.jadwalId === jadwalId && p.status && !p.status.includes('Dihapus'));
      let teksWA = `🏸 *REKAP PESERTA MABAR* 🏸\n`;
      const displayTgl = tanggal ? new Date(tanggal).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '';
      teksWA += `📍 *${infoRaw}* | 🗓️ ${displayTgl} \n`;
      teksWA += `👥 Slot Terisi: ${pesertaJadwal.length}/${kuota}\n\n`;
      if (pesertaJadwal.length === 0) teksWA += `_Belum ada peserta terdaftar._`;
      else pesertaJadwal.forEach((p, idx) => { teksWA += `${idx + 1}. ${p.nama} (${p.status.includes('Lunas') ? 'Lunas 🟢' : 'Pending 🟡'})\n`; });
      teksWA += `\n_Yuk amankan slotnya!_`;
      navigator.clipboard.writeText(teksWA).then(() => {
        showCustomWarning("Berhasil", "List peserta berhasil disalin ke clipboard!");
      });
    });
  }

  async function toggleStatusJadwal(jadwalId, statusBaru, btn) {
    const oldText = btn.innerText;
    btn.innerText = '...'; btn.disabled = true;
    try {
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'toggle_status_jadwal', jadwalId, statusBaru }) });
      await loadDataAdmin(); // Update data secara halus tanpa refresh
    } catch (e) {
      showCustomWarning("Gagal", "Gagal mengubah status jadwal.");
      btn.innerText = oldText; btn.disabled = false;
    }
  }

  function bukaModalEditNominal(rowIndex, nama, currentTagihan) {
    document.getElementById('editRowIndexInput').value = rowIndex;
    document.getElementById('editNamaPesertaLabel').innerText = `Peserta: ${nama}`;
    document.getElementById('inputNominalBaru').value = currentTagihan;
    document.getElementById('modalEditNominal').classList.remove('hidden');
  }

  function tutupModalEditNominal() { document.getElementById('modalEditNominal').classList.add('hidden'); }

  async function simpanNominalBaru(btn) {
    const rowIndex = document.getElementById('editRowIndexInput').value;
    const nominalBaru = document.getElementById('inputNominalBaru').value.trim();
    if (!nominalBaru || isNaN(nominalBaru)) return showCustomWarning("Validasi", "Masukkan nominal angka yang valid!");

    const oldText = btn.innerText;
    btn.innerText = 'Menyimpan...'; btn.disabled = true;

    await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'update_tagihan', rowIndex: parseInt(rowIndex), tagihanBaru: parseInt(nominalBaru) }) });
    tutupModalEditNominal();
    await loadDataAdmin(); // Reload halus

    btn.innerText = oldText; btn.disabled = false;
  }

  async function tambahJadwalBaru(btn) {
    const payload = {
      action: 'add_jadwal',
      id: document.getElementById('addId').value.trim(),
      tanggal: document.getElementById('addTanggal').value.trim(),
      info: document.getElementById('addInfo').value.trim(),
      jam: document.getElementById('addJam').value.trim(),
      htm: document.getElementById('addHtm').value.trim(),
      kuota: document.getElementById('addKuota').value.trim()
    };
    if (!payload.id || !payload.tanggal || !payload.info || !payload.jam || payload.htm === '' || !payload.kuota) {
      return showCustomWarning("Form Belum Lengkap", "Harap isi semua kolom form tambah jadwal!");
    }
    const oldText = btn.innerText;
    btn.innerText = 'Menyimpan...'; btn.disabled = true;

    await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
    await loadDataAdmin(); // Reload halus

    ['addId', 'addTanggal', 'addInfo', 'addJam', 'addHtm', 'addKuota'].forEach(id => document.getElementById(id).value = '');
    btn.innerText = oldText; btn.disabled = false;
  }

  async function accPemain(rowIndex, btn) {
    showConfirmModal("Konfirmasi Pembayaran", "Konfirmasi pemain ini sudah bayar dan ubah status jadi Lunas?", "Ya, ACC Lunas", "bg-emerald-600 hover:bg-emerald-700", async () => {
      const oldText = btn.innerText;
      btn.innerText = '...'; btn.disabled = true;

      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'update_status', rowIndex: rowIndex }) });
      await loadDataAdmin(); // Reload halus
    });
  }

  async function hapusPemain(rowIndex, btn) {
    showConfirmModal("Hapus Peserta", "Yakin ingin menghapus peserta ini dari daftar?", "Ya, Hapus", "bg-rose-600 hover:bg-rose-700", async () => {
      const oldText = btn.innerText;
      btn.innerText = '...'; btn.disabled = true;

      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'delete_row', rowIndex: rowIndex }) });
      await loadDataAdmin(); // Reload halus
    });
  }

  function hapusPemainDariRekap(rowIndex, btnElement) { hapusPemain(rowIndex, { innerText: '', disabled: false }); }

  function bukaModalEditJadwal(id, tanggal, info, jam, htm, kuota) {
    document.getElementById('editJadwalLabelId').innerText = `${id}`;
    document.getElementById('editJadwalId').value = id;
    document.getElementById('editJadwalTanggal').value = tanggal;
    document.getElementById('editJadwalInfo').value = info;
    document.getElementById('editJadwalJam').value = jam;
    document.getElementById('editJadwalHtm').value = htm;
    document.getElementById('editJadwalKuota').value = kuota;
    document.getElementById('modalEditJadwal').classList.remove('hidden');
  }

  function tutupModalEditJadwal() { document.getElementById('modalEditJadwal').classList.add('hidden'); }

  async function simpanEditJadwal(btn) {
    const payload = {
      action: 'edit_jadwal',
      id: document.getElementById('editJadwalId').value,
      tanggal: document.getElementById('editJadwalTanggal').value,
      info: document.getElementById('editJadwalInfo').value,
      jam: document.getElementById('editJadwalJam').value,
      htm: document.getElementById('editJadwalHtm').value,
      kuota: document.getElementById('editJadwalKuota').value
    };
    if (!payload.tanggal || !payload.info || !payload.jam || payload.htm === '' || !payload.kuota) {
      return showCustomWarning("Form Belum Lengkap", "Harap lengkapi semua kolom form edit jadwal!");
    }
    const oldText = btn.innerText;
    btn.innerText = 'Menyimpan...'; btn.disabled = true;

    await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
    tutupModalEditJadwal();
    await loadDataAdmin(); // Reload halus

    btn.innerText = oldText; btn.disabled = false;
  }

  async function hapusJadwalMaster(jadwalId) {
    showConfirmModal(
      "Hapus Jadwal",
      `Yakin ingin menghapus jadwal [${jadwalId}] secara permanen dari master?`,
      "Ya, Hapus",
      "bg-rose-600 hover:bg-rose-700",
      async () => {
        try {
          const response = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'delete_jadwal', id: jadwalId })
          });
          const result = await response.json();

          if (result.status === 'success') {
            await loadDataAdmin(); // Reload halus tanpa hard refresh
          } else {
            throw new Error(result.message || 'Gagal menghapus');
          }
        } catch (error) {
          console.error("Gagal hapus jadwal:", error);
          showCustomWarning("Error", "Gagal menghapus jadwal: " + error.message);
        }
      }
    );
  }
</script>
