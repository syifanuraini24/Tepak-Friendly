<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Tepak Friendly</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">

  <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
    <h1 class="text-xl font-bold text-center mb-6">Panel Admin Tepak Friendly</h1>
    
    <div id="loginSection" class="mb-4">
      <label for="passInput" class="block text-sm font-medium text-gray-700 mb-1">Password Admin</label>
      <input type="password" id="passInput" placeholder="Masukkan password..." class="w-full p-2 border rounded mb-3">
      <button onclick="login()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold p-2 rounded transition">Masuk</button>
    </div>

    <div id="adminPanel" class="hidden">
      <h2 class="font-bold mb-3 border-b pb-2">Menunggu Konfirmasi Pembayaran</h2>
      <ul id="listMenunggu" class="space-y-3"></ul>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbz1L8QX-I2xH_joKIK4ihQMGLNlkeBzQ2XtNfW2Bs66dfvhlpnTQJ212j32MARIX1TnPw/exec'; 

    function login() {
      const pass = document.getElementById('passInput').value;
      if (pass === 'tepakfriendly') { 
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadDataAdmin();
      } else {
        alert('Password salah!');
      }
    }

    async function loadDataAdmin() {
      const list = document.getElementById('listMenunggu');
      list.innerHTML = '<li class="text-center text-sm text-gray-500">Memuat data...</li>';
      
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        list.innerHTML = '';
        
        const pendingList = data.pemain.filter(item => item.status && item.status.includes('Menunggu'));
        
        if(pendingList.length === 0) {
          list.innerHTML = '<li class="text-center text-green-600 text-sm font-bold p-4 bg-green-50 rounded">Semua pembayaran sudah Lunas! 🎉</li>';
          return;
        }

        const formatRp = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 });

        pendingList.forEach(item => {
          const tagihanRp = formatRp.format(item.tagihan || 0);
          list.innerHTML += `
            <li class="p-3 border border-orange-200 bg-orange-50 rounded flex flex-col">
              <div class="flex justify-between items-center mb-2">
                <div>
                  <span class="font-bold text-sm block">${item.nama}</span>
                  <span class="text-xs font-mono text-red-600 font-bold bg-white px-1 border rounded">${tagihanRp}</span>
                </div>
                <button onclick="accPemain(${item.rowIndex}, this)" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold px-3 py-2 rounded transition shadow">
                  ACC LUNAS
                </button>
              </div>
              <span class="text-xs text-gray-600 mt-1">📍 ${item.jadwal}</span>
            </li>`;
        });
      } catch (error) {
        console.error("Gagal memuat data dari GAS:", error);
        list.innerHTML = '<li class="text-center text-red-500 text-sm">Gagal memuat. Periksa koneksi atau URL GAS.</li>';
      }
    }

    async function accPemain(rowIndex, btnElement) {
      if(!confirm('Konfirmasi pemain ini sudah bayar dan kirim email lunas?')) return;
      
      btnElement.innerText = 'Proses...';
      btnElement.disabled = true;
      
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'update_status', rowIndex: rowIndex })
        });
        
        const result = await response.json();
        if(result.status === 'updated') {
          await loadDataAdmin(); 
        } else {
          throw new Error("Gagal mengupdate di server");
        }
      } catch (error) {
        console.error("Gagal melakukan ACC:", error);
        alert('Gagal mengupdate status. Silakan coba lagi.');
        btnElement.innerText = 'ACC LUNAS';
        btnElement.disabled = false;
      }
    }
  </script>
</body>
</html>
