<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo.png">
    <title>Tambah Jadwal - Admin Tepak Friendly</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen p-4 font-sans text-slate-800 antialiased pb-12">

    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-6">

        <!-- Header & Navigasi Kembali -->
        <div class="flex justify-between items-center border-b border-slate-100 pb-4">
            <div>
                <h1 class="text-base font-extrabold text-slate-900">➕ Tambah Jadwal Mabar Baru</h1>
                <p class="text-[11px] text-slate-500">Atur lokasi GOR, waktu, HTM, kuota, dan banner acara</p>
            </div>
            <a href="admin.html"
                class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-2 rounded-xl transition">
                ⬅️ Menu Utama
            </a>
        </div>

        <!-- Form Input Jadwal -->
        <div class="space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <input type="text" id="addId" placeholder="ID Jadwal (Cth: Mabar-03)"
                    class="p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="date" id="addTanggal"
                    class="p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-500">
                <input type="text" id="addInfo" placeholder="Lokasi GOR (Cth: Gor Karapitan)"
                    class="p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 sm:col-span-2">
                <input type="text" id="addJam" placeholder="Jam Main (Cth: 11:30 - 14:00)"
                    class="p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <div class="flex gap-2">
                    <input type="number" id="addHtm" placeholder="HTM (Rp)"
                        class="flex-1 p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
                    <input type="number" id="addKuota" placeholder="Kuota"
                        class="w-1/3 p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
                </div>
                <div class="sm:col-span-2 space-y-2">
                    <label class="block text-[11px] font-bold text-slate-600">Banner Acara (Opsional - Maks 2
                        MB)</label>
                    <input type="file" id="addBannerFile" accept="image/*"
                        onchange="previewLocalBanner(this, 'addBannerLivePreview', 'addBannerLiveImg')"
                        class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition bg-slate-50 border border-slate-200 rounded-xl p-1">
                    <div id="addBannerLivePreview"
                        class="hidden rounded-xl overflow-hidden border border-slate-200 bg-white">
                        <img id="addBannerLiveImg" src="" alt="Preview Banner" class="w-full h-28 object-cover">
                    </div>
                </div>
            </div>
            <button onclick="tambahJadwalBaru(this)"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-3 px-4 rounded-xl transition shadow-sm">Simpan
                & Publikasikan Jadwal</button>
        </div>

    </div>

    <!-- Modal Custom Notifikasi -->
    <div id="customModal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-[9999] hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 space-y-3">
            <h3 id="modalTitle" class="font-bold text-sm text-slate-900">Notifikasi</h3>
            <p id="modalDesc" class="text-xs text-slate-600">-</p>
            <div class="flex gap-2 pt-2">
                <button id="modalBtnConfirm"
                    class="flex-1 font-bold text-xs py-2.5 px-3 rounded-xl transition text-white bg-blue-600 hover:bg-blue-700">OK</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const GAS_URL = CONFIG.GAS_URL;

        function showCustomWarning(title, desc) {
            const modal = document.getElementById('customModal');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            const btnConfirm = document.getElementById('modalBtnConfirm');
            modal.classList.remove('hidden');

            const newBtn = btnConfirm.cloneNode(true);
            btnConfirm.parentNode.replaceChild(newBtn, btnConfirm);
            newBtn.addEventListener('click', () => modal.classList.add('hidden'));
        }

        function previewLocalBanner(input, containerId, imgId) {
            const container = document.getElementById(containerId);
            const img = document.getElementById(imgId);
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    img.src = e.target.result;
                    container.classList.remove('hidden');
                };
                reader.readAsDataURL(input.files[0]);
            } else {
                img.src = '';
                container.classList.add('hidden');
            }
        }

        function compressImage(file, maxWidth = 900, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        async function tambahJadwalBaru(btn) {
            const fileInput = document.getElementById('addBannerFile');
            let bannerBase64 = "";
            let bannerName = "";

            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                if (file.size > 2 * 1024 * 1024) {
                    return showCustomWarning("Ukuran File Terlalu Besar", "Ukuran gambar maksimal adalah 2 MB!");
                }
                bannerName = file.name;
                bannerBase64 = await compressImage(file, 900, 0.75);
            }

            const payload = {
                action: 'add_jadwal',
                id: document.getElementById('addId').value.trim(),
                tanggal: document.getElementById('addTanggal').value.trim(),
                info: document.getElementById('addInfo').value.trim(),
                jam: document.getElementById('addJam').value.trim(),
                htm: document.getElementById('addHtm').value.trim(),
                kuota: document.getElementById('addKuota').value.trim(),
                bannerBase64: bannerBase64,
                bannerName: bannerName
            };

            if (!payload.id || !payload.tanggal || !payload.info || !payload.jam || payload.htm === '' || !payload.kuota) {
                return showCustomWarning("Form Belum Lengkap", "Harap isi semua kolom form tambah jadwal!");
            }

            const oldText = btn.innerText;
            btn.innerText = 'Menyimpan...';
            btn.disabled = true;

            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.status !== 'success') throw new Error(result.message || 'Gagal menyimpan jadwal.');

                showCustomWarning("Berhasil", "Jadwal baru berhasil disimpan!");
                setTimeout(() => {
                    window.location.href = 'admin.html'; // Kembali otomatis ke dashboard setelah sukses
                }, 1500);
            } catch (err) {
                showCustomWarning("Gagal Menyimpan", err.message);
                btn.innerText = oldText;
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
