<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Titik Rotasi - Pendaftaran Mabar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans text-gray-800">

  <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
    <h1 class="text-2xl font-bold text-center mb-6">🏸 Titik Rotasi</h1>
    
    <div class="mb-6 p-4 border border-blue-100 rounded bg-blue-50">
      <h2 class="font-bold mb-3">Daftar Mabar</h2>
      
      <!-- Penambahan Label untuk Select -->
      <label for="pilihJadwal" class="block text-sm font-medium text-gray-700 mb-1">Jadwal Mabar</label>
      <select id="pilihJadwal" class="w-full p-2 border rounded mb-3 bg-white">
        <option value="">-- Memuat Jadwal... --</option>
      </select>
      
      <!-- Penambahan Label untuk Input Teks -->
      <label for="namaPemain" class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
      <input type="text" id="namaPemain" placeholder="Masukkan nama..." class="w-full p-2 border rounded mb-3">
      
      <p class="text-xs text-gray-600 mb-3 leading-relaxed">
        *Silakan transfer HTM Rp 40.000 ke <strong>BCA 123456789 a.n Syifa Nur Aini</strong> sebelum submit.
      </p>
      <button onclick="daftar()" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">
        Submit & Join List
      </button>
    </div>

    <h2 class="font-bold mb-3 border-b pb-2">Live Player List</h2>
    <ul id="listPemain" class="space-y-3">
      <li class="text-center text-gray-500 text-sm">Memuat data...</li>
    </ul>
  </div>

  <script>
    const GAS_URL = 'Follow link (ctrl + click)'; 

    async function loadData() {
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        
        const selectJadwal = document.getElementById('pilihJadwal');
        selectJadwal.innerHTML = '<option value="">-- Pilih Jadwal Mabar --</option>';
        data.jadwal.forEach(j => {
          selectJadwal.innerHTML += `<option value="${j.info}">${j.info}</option>`;
        });

        const list = document.getElementById('listPemain');
        list.innerHTML = '';
        if(data.pemain.length === 0) {
          list.innerHTML = '<li class="text-center text-sm text-gray-400">Belum ada pemain yang mendaftar.</li>';
        }
        
        data.pemain.forEach((item, index) => {
          const isLunas = item.status.includes('Lunas');
          list.innerHTML += `
            <li class="p-3 border rounded ${isLunas ? 'bg-green-50 border-green-100' : 'bg-gray-50'} flex flex-col">
              <div class="flex justify-between items-center mb-1">
                <span class="font-bold text-sm">${index + 1}. ${item.nama}</span>
                <span class="text-xs font-semibold ${isLunas ? 'text-green-600' : 'text-orange-500'}">${item.status}</span>
              </div>
              <span class="text-xs text-gray-500">📍 ${item.jadwal}</span>
            </li>`;
        });
      } catch (error) {
        // Penanganan eror S2486: Menggunakan objek error
        console.error("Gagal memuat data dari GAS:", error);
        document.getElementById('listPemain').innerHTML = '<li class="text-center text-red-500 text-sm">Gagal memuat data. Refresh halaman.</li>';
      }
    }

    async function daftar() {
      const nama = document.getElementById('namaPemain').value.trim();
      const jadwal = document.getElementById('pilihJadwal').value;
      const btn = document.getElementById('btnSubmit');
      
      if(!jadwal) return alert('Pilih jadwal terlebih dahulu!');
      if(!nama) return alert('Isi nama lengkapmu!');

      btn.innerText = 'Memproses...';
      btn.disabled = true;

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'register', nama: nama, jadwal: jadwal })
        });
        
        document.getElementById('pilihJadwal').value = '';
        document.getElementById('namaPemain').value = '';
        alert('Berhasil daftar! Status kamu sekarang Menunggu Konfirmasi.');
        await loadData(); // Tambahan await saat memuat ulang data
      } catch (error) {
        // Penanganan eror S2486: Menggunakan objek error
        console.error("Gagal mengirim data pendaftaran:", error);
        alert('Terjadi kesalahan saat mendaftar.');
      } finally {
        btn.innerText = 'Submit & Join List';
        btn.disabled = false;
      }
    }

    // Penanganan peringatan S7785: Menjalankan fungsi setelah DOM siap
    document.addEventListener('DOMContentLoaded', () => {
      loadData().catch(console.error);
    });
  </script>
</body>
</html>
