<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Lapak UMKM - Tepak Friendly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 antialiased pb-12">

  <!-- HEADER ADMIN -->
  <header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200 px-4 py-3 shadow-xs">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <img src="logo.png" alt="Logo Tepak Friendly" class="w-8 h-8 object-contain rounded-lg shadow-xs border border-slate-100 bg-white">
        <div>
          <h1 class="text-sm font-extrabold tracking-tight text-slate-900 leading-tight">Admin Lapak UMKM</h1>
          <p class="text-[9px] text-slate-500 font-medium">Kelola Penugasan & Approval Mitra</p>
        </div>
      </div>
      <a href="admin" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs py-1.5 px-3 rounded-xl transition flex items-center gap-1">
        <span>←</span> Admin Mabar
      </a>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-4 space-y-4">

    <!-- SECTION LOGIN ADMIN (DEFAULT TAMPIL) -->
    <div id="sectionLoginAdmin" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <h2 class="font-bold text-sm text-slate-900">Login Admin Lapak UMKM</h2>
      <p class="text-xs text-slate-500">Masukkan kata sandi admin untuk mengakses penugasan mitra.</p>
      <div>
        <input type="password" id="inputPassAdmin" placeholder="Password Admin Jualan..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
      </div>
      <button onclick="loginAdminJualan()" id="btnLoginAdmin" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs py-3 rounded-xl transition shadow-xs">
        Masuk Admin
      </button>
    </div>

    <!-- SECTION DASHBOARD ADMIN (TERSEMBUNYI SEBELUM LOGIN) -->
    <div id="sectionDashboardAdmin" class="hidden space-y-4">
      <!-- STATS SUMMARY -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-xs text-center">
          <span class="text-[10px] text-slate-400 font-bold block uppercase tracking-wider">Mitra Pending</span>
          <span id="statPending" class="text-xl font-extrabold text-amber-600">0</span>
        </div>
        <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-xs text-center">
          <span class="text-[10px] text-slate-400 font-bold block uppercase tracking-wider">Mitra Disetujui</span>
          <span id="statApproved" class="text-xl font-extrabold text-emerald-600">0</span>
        </div>
      </div>

      <!-- LIST MITRA UMKM -->
      <div class="space-y-3">
        <div class="flex justify-between items-center px-1">
          <h2 class="font-bold text-xs text-slate-900 uppercase tracking-wide">Daftar Pendaftaran Mitra</h2>
          <button onclick="loadAdminJualanData()" class="text-[11px] font-bold text-blue-600 hover:underline">🔄 Refresh Data</button>
        </div>

        <div id="containerAdminJualan" class="space-y-3.5">
          <div class="text-center text-slate-400 text-xs py-8 bg-white rounded-2xl border border-slate-200">Memuat data pendaftaran mitra...</div>
        </div>
      </div>
    </div>

  </main>

  <script src="admin-jualan.js" defer></script>
</body>
</html>
