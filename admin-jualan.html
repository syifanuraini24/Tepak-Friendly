<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Jualan - Tepak Friendly</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans text-slate-800 antialiased">

  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
    <h1 class="text-base font-extrabold text-center mb-5 text-orange-800">🛍️ Panel Admin Khusus Jualan & UMKM</h1>
    
    <div id="loginSection" class="max-w-sm mx-auto space-y-3 py-6">
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Password Admin Jualan</label>
        <input type="password" id="passInput" placeholder="Masukkan password..." class="w-full p-3 border border-slate-200 rounded-xl text-xs bg-slate-50">
      </div>
      <button onclick="login()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold text-xs py-3 rounded-xl transition shadow-sm">Masuk Panel Jualan</button>
    </div>

    <div id="adminPanel" class="hidden space-y-6">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <span class="text-xs font-semibold text-slate-600">Status: <span class="text-emerald-600 font-bold">Online 🟢</span></span>
        <div class="flex gap-2">
          <button onclick="loadDataAdminJualan()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-xl transition">🔄 Refresh</button>
          <button onclick="logout()" class="bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold px-3 py-1.5 rounded-xl transition">🚪 Logout</button>
        </div>
      </div>

      <div>
        <h2 class="font-bold text-xs text-slate-700 uppercase tracking-wide mb-2">🏪 Approval Lapak & Penugasan Jadwal</h2>
        <ul id="listLapakPending" class="space-y-3">
          <li class="text-center text-xs text-slate-400 py-4 bg-slate-50 rounded-xl border">Memuat data lapak...</li>
        </ul>
      </div>

      <div class="pt-3 border-t border-slate-100">
        <h2 class="font-bold text-xs text-slate-700 uppercase tracking-wide mb-2">⏳ Konfirmasi Pembayaran Pesanan</h2>
        <ul id="listPesananPending" class="space-y-3">
          <li class="text-center text-xs text-slate-400 py-4 bg-slate-50 rounded-xl border">Memuat data pesanan...</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const GAS_URL = CONFIG.GAS_URL;
    let listJadwalGlobal = [];

    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('tepak_jualan_login_time')) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadDataAdminJualan();
      }
    });

    async function login() {
      const pass = document.getElementById('passInput').value;
      const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'login_admin_jualan', password: pass }) });
      const result = await res.json();
      if (result.status === 'success') {
        localStorage.setItem('tepak_jualan_login_time', new Date().getTime().toString());
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadDataAdminJualan();
      } else { alert(result.message); }
    }

    function logout() { localStorage.removeItem('tepak_jualan_login_time'); window.location.reload(); }

    async function loadDataAdminJualan() {
      const listLapak = document.getElementById('listLapakPending');
      const listPesanan = document.getElementById('listPesananPending');
      const formatRp = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 });

      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        listJadwalGlobal = data.jadwal || [];
        
        const pendingLapak = (data.jualan || []).filter(item => item.status && item.status.includes('Menunggu'));
        listLapak.innerHTML = '';
        if (pendingLapak.length === 0) {
          listLapak.innerHTML = '<li class="text-center text-slate-400 text-xs py-3 bg-slate-50 rounded-xl border">Tidak ada pendaftaran lapak baru.</li>';
        } else {
          pendingLapak.forEach(item => {
            let opsiJadwalHtml = '<option value="">-- Pilih Jadwal Mabar --</option>';
            listJadwalGlobal.forEach(j => {
              opsiJadwalHtml += `<option value="${j.id}" data-info="${j.info}">[${j.id}] ${j.info}</option>`;
            });

            listLapak.innerHTML += `
              <li class="p-3.5 border border-orange-200 bg-orange-50/50 rounded-xl space-y-2.5 text-xs">
                <div>
                  <strong class="text-sm text-slate-900">${item.namaPenjual}</strong> (WA: ${item.whatsapp})<br>
                  <div class="text-[11px] text-slate-600 bg-white p-2 rounded-lg border mt-1 whitespace-pre-line"><strong>Menu:</strong><br>${item.menuJualan}</div>
                </div>
                <div>
                  <label class="block font-bold text-[10px] text-slate-500 uppercase mb-1">Assign ke Jadwal Mabar:</label>
                  <select id="selectJadwal_${item.rowIndex}" class="w-full p-2 border border-orange-200 rounded-lg bg-white text-xs">
                    ${opsiJadwalHtml}
                  </select>
                </div>
                <div class="flex gap-2 pt-1">
                  <button onclick="accLapak(${item.rowIndex})" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg shadow-xs">ACC & Assign</button>
                  <button onclick="hapusLapak(${item.rowIndex})" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-3 py-2 rounded-lg shadow-xs">Tolak</button>
                </div>
              </li>`;
          });
        }

        const pendingPesanan = (data.pesanan || []).filter(item => item.status && item.status.includes('Menunggu'));
        listPesanan.innerHTML = '';
        if (pendingPesanan.length === 0) {
          listPesanan.innerHTML = '<li class="text-center text-slate-400 text-xs py-3 bg-slate-50 rounded-xl border">Tidak ada pesanan makanan baru.</li>';
        } else {
          pendingPesanan.forEach(item => {
            listPesanan.innerHTML += `
              <li class="p-3.5 border border-blue-200 bg-blue-50/50 rounded-xl flex justify-between items-center text-xs">
                <div>
                  <strong>Pemesan: ${item.namaPemesan}</strong> ➔ Lapak: ${item.namaLapak}<br>
                  <span class="text-slate-700">Pesanan: ${item.detailPesanan}</span><br>
                  <span class="font-mono font-bold text-blue-700">Tagihan: ${formatRp.format(item.totalTagihan || 0)}</span> | 📍 ${item.jadwalInfo}
                </div>
                <div class="flex flex-col gap-1.5">
                  <button onclick="accPesanan(${item.rowIndex}, this)" class="bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-lg shadow-xs">ACC Lunas</button>
                  <button onclick="hapusPesanan(${item.rowIndex}, this)" class="bg-rose-600 text-white font-bold px-3 py-1.5 rounded-lg shadow-xs">Hapus</button>
                </div>
              </li>`;
          });
        }
      } catch (e) { console.error(e); }
    }

    async function accLapak(rowIndex) {
      const select = document.getElementById(`selectJadwal_${rowIndex}`);
      const opt = select.options[select.selectedIndex];
      if (!opt.value) return alert('Pilih jadwal mabar terlebih dahulu untuk lapak ini!');

      if (!confirm(`Setujui lapak ini untuk jadwal [${opt.value}] ${opt.getAttribute('data-info')}?`)) return;
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'update_jualan_status_with_jadwal', rowIndex, jadwalId: opt.value, jadwalInfo: opt.getAttribute('data-info') }) });
      loadDataAdminJualan();
    }

    async function hapusLapak(rowIndex) {
      if (!confirm('Tolak / hapus pendaftaran lapak ini?')) return;
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'delete_jualan', rowIndex }) });
      loadDataAdminJualan();
    }

    async function accPesanan(rowIndex, btn) {
      if (!confirm('Konfirmasi pembayaran pesanan ini sudah lunas?')) return;
      btn.disabled = true;
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'update_pesanan_status', rowIndex }) });
      loadDataAdminJualan();
    }

    async function hapusPesanan(rowIndex, btn) {
      if (!confirm('Hapus pesanan ini?')) return;
      btn.disabled = true;
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'delete_pesanan', rowIndex }) });
      loadDataAdminJualan();
    }
  </script>
</body>
</html>
