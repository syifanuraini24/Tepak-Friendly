<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Jualan - Tepak Friendly</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans text-gray-800">

  <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-md p-6">
    <h1 class="text-xl font-bold text-center mb-6 text-orange-800">🛍️ Panel Admin Khusus Jualan & UMKM</h1>
    
    <!-- Login Admin Jualan -->
    <div id="loginSection" class="max-w-md mx-auto mb-4">
      <label for="passInput" class="block text-sm font-medium text-gray-700 mb-1">Password Admin Jualan</label>
      <input type="password" id="passInput" placeholder="Masukkan password jualan..." class="w-full p-2 border rounded mb-3">
      <button onclick="login()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold p-2 rounded transition">Masuk Panel Jualan</button>
    </div>

    <!-- Panel Utama Admin Jualan -->
    <div id="adminPanel" class="hidden space-y-6">
      
      <div class="flex justify-between items-center border-b pb-3">
        <span class="text-sm font-semibold text-gray-600">Status: <span class="text-green-600 font-bold">Online 🟢</span></span>
        <div class="flex gap-2">
          <button onclick="loadDataAdminJualan()" class="bg-orange-50 hover:bg-orange-100 text-orange-700 text-xs font-bold px-3 py-1.5 rounded border border-orange-200 transition">🔄 Refresh</button>
          <button onclick="logout()" class="bg-red-50 hover:bg-red-100 text-red-700 text-xs font-bold px-3 py-1.5 rounded border border-red-200 transition">🚪 Logout</button>
        </div>
      </div>

      <!-- 1. Approval Lapak UMKM -->
      <div>
        <h2 class="font-bold text-sm text-gray-700 mb-2">🏪 Approval Pendaftaran Lapak UMKM</h2>
        <ul id="listLapakPending" class="space-y-3">
          <li class="text-center text-sm text-gray-500 py-3">Memuat data lapak...</li>
        </ul>
      </div>

      <!-- 2. Konfirmasi Pembayaran Pesanan Jajanan -->
      <div class="mt-6">
        <h2 class="font-bold text-sm text-gray-700 mb-2">⏳ Konfirmasi Pembayaran Pesanan Jajanan</h2>
        <ul id="listPesananPending" class="space-y-3">
          <li class="text-center text-sm text-gray-500 py-3">Memuat data pesanan...</li>
        </ul>
      </div>

    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const GAS_URL = CONFIG.GAS_URL;
    const SESSION_DURATION = 6 * 60 * 60 * 1000;

    document.addEventListener('DOMContentLoaded', () => {
      const loginTime = localStorage.getItem('tepak_jualan_login_time');
      if (loginTime && (new Date().getTime() - parseInt(loginTime) < SESSION_DURATION)) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadDataAdminJualan();
      }
    });

    async function login() {
      const pass = document.getElementById('passInput').value;
      if (!pass) return alert('Masukkan password!');

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login_admin_jualan', password: pass })
        });
        const result = await response.json();

        if (result.status === 'success') {
          localStorage.setItem('tepak_jualan_login_time', new Date().getTime().toString());
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('adminPanel').classList.remove('hidden');
          loadDataAdminJualan();
        } else {
          alert(result.message);
        }
      } catch (e) {
        alert('Koneksi gagal.');
      }
    }

    function logout() {
      localStorage.removeItem('tepak_jualan_login_time');
      window.location.reload();
    }

    async function loadDataAdminJualan() {
      const listLapak = document.getElementById('listLapakPending');
      const listPesanan = document.getElementById('listPesananPending');
      const formatRp = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 });

      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        
        // Render Pending Lapak
        const pendingLapak = (data.jualan || []).filter(item => item.status && item.status.includes('Menunggu'));
        listLapak.innerHTML = '';
        if (pendingLapak.length === 0) {
          listLapak.innerHTML = '<li class="text-center text-gray-400 text-xs py-3 bg-gray-50 rounded border">Tidak ada pendaftaran lapak baru.</li>';
        } else {
          pendingLapak.forEach(item => {
            listLapak.innerHTML += `
              <li class="p-3 border border-orange-200 bg-orange-50 rounded flex justify-between items-center text-xs">
                <div>
                  <strong>${item.namaPenjual}</strong> (${item.menuJualan})<br>
                  <span class="text-gray-500">📍 [${item.jadwalId}] ${item.jadwalInfo} | WA: ${item.whatsapp}</span>
                </div>
                <div class="flex gap-1.5">
                  <button onclick="accLapak(${item.rowIndex}, this)" class="bg-green-600 text-white font-bold px-3 py-1.5 rounded shadow">ACC LAPAK</button>
                  <button onclick="hapusLapak(${item.rowIndex}, this)" class="bg-red-600 text-white font-bold px-3 py-1.5 rounded shadow">TOLAK</button>
                </div>
              </li>`;
          });
        }

        // Render Pending Pesanan Jajanan
        const pendingPesanan = (data.pesanan || []).filter(item => item.status && item.status.includes('Menunggu'));
        listPesanan.innerHTML = '';
        if (pendingPesanan.length === 0) {
          listPesanan.innerHTML = '<li class="text-center text-gray-400 text-xs py-3 bg-gray-50 rounded border">Tidak ada pesanan makanan yang menunggu konfirmasi.</li>';
        } else {
          pendingPesanan.forEach(item => {
            const nominalRp = formatRp.format(item.totalTagihan || 0);
            listPesanan.innerHTML += `
              <li class="p-3 border border-blue-200 bg-blue-50 rounded flex justify-between items-center text-xs">
                <div>
                  <strong>Pemesan: ${item.namaPemesan}</strong> ➔ Lapak: ${item.namaLapak}<br>
                  <span class="text-gray-700">Pesanan: ${item.detailPesanan}</span><br>
                  <span class="font-mono font-bold text-blue-700">Tagihan: ${nominalRp}</span> | 📍 ${item.jadwalInfo}
                </div>
                <div class="flex gap-1.5 flex-col">
                  <button onclick="accPesanan(${item.rowIndex}, this)" class="bg-green-600 text-white font-bold px-3 py-1.5 rounded shadow">ACC LUNAS</button>
                  <button onclick="hapusPesanan(${item.rowIndex}, this)" class="bg-red-600 text-white font-bold px-3 py-1.5 rounded shadow">HAPUS</button>
                </div>
              </li>`;
          });
        }
      } catch (e) {
        console.error("Gagal load admin jualan:", e);
      }
    }

    async function accLapak(rowIndex, btn) {
      if (!confirm('Setujui lapak ini agar tampil di publik?')) return;
      btn.disabled = true;
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'update_jualan_status', rowIndex }) });
      loadDataAdminJualan();
    }

    async function hapusLapak(rowIndex, btn) {
      if (!confirm('Tolak / hapus lapak ini?')) return;
      btn.disabled = true;
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'delete_jualan', rowIndex }) });
      loadDataAdminJualan();
    }

    async function accPesanan(rowIndex, btn) {
      if (!confirm('Konfirmasi pembayaran pesanan makanan ini sudah lunas?')) return;
      btn.disabled = true;
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'update_pesanan_status', rowIndex }) });
      loadDataAdminJualan();
    }

    async function hapusPesanan(rowIndex, btn) {
      if (!confirm('Hapus pesanan ini?')) return;
      btn.disabled = true;
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'delete_pesanan', rowIndex }) });
      loadDataAdminJualan();
    }
  </script>
</body>
</html>
